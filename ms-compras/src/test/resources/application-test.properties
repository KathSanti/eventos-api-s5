# Perfil TEST mvn test y GitHub Actions

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.gateway.secret=

# Valores falsos para tests (no se conecta a Entra ID)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.local/issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://test.local/keys
spring.security.oauth2.resourceserver.jwt.audiences=test-audience