#  ms-compras: 
spring.application.name=ms-compras
server.port=${PORT:8081}

spring.profiles.default=prod

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.jpa.open-in-view=false

# secreto que agrega el API Gateway (vacío = desactivado)
app.gateway.secret=${GATEWAY_SECRET:}


#Variables Entra ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ENTRA_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# No exponer detalles internos al cliente
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
