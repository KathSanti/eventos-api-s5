# =====================================================================
#  Perfil PROD (EC2): MySQL en AWS RDS. Todo viene de variables de entorno.
#  DB_HOST = endpoint de RDS, por ejemplo eventos-db.xxxxxx.us-east-1.rds.amazonaws.com
#  createDatabaseIfNotExist: crea la base compras_db en RDS si no existe.
# =====================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:compras_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# "update" crea/ajusta tablas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
