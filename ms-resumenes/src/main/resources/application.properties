
spring.application.name=ms-resumenes
server.port=${PORT:8082}

# Lee un .env si existe (en la carpeta del microservicio o en la raíz del repo). Está en .gitignore.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Comunicación con ms-compras 
app.compras.url=${COMPRAS_URL:http://localhost:8081}

# AWS S3 
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
app.s3.bucket=${S3_BUCKET}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.session-token=${AWS_SESSION_TOKEN:}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

#EntraID
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ENTRA_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# EXTRA OPCIONAL: secreto que agrega el API Gateway (vacío = desactivado). Ver OrigenGatewayFilter.
app.gateway.secret=${GATEWAY_SECRET:}

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never